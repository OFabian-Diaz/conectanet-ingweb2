apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: conectanet
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # actualizaciones sin caída
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Prometheus (si se instala en el clúster) descubre el endpoint de métricas
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # usuario "node" de la imagen
      containers:
        - name: backend
          # Imagen construida localmente y cargada en Minikube/kind (ver README).
          # Para la nube: ghcr.io/<usuario>/conectanet-backend:<etiqueta>
          image: conectanet-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef: { name: conectanet-config }
            - secretRef: { name: conectanet-secretos } # DB_PASSWORD y JWT_SECRET
          readinessProbe:
            httpGet: { path: /api/salud/lista, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/salud, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: backend # el Nginx del frontend reenvía /api a http://backend:4000
  namespace: conectanet
  labels:
    app: backend
spec:
  type: ClusterIP # solo accesible dentro del clúster
  selector:
    app: backend
  ports:
    - name: http
      port: 4000
      targetPort: http
