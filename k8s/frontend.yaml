apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: conectanet
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # usuario nginx de la imagen nginx-unprivileged
      containers:
        - name: frontend
          image: conectanet-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: conectanet
  labels:
    app: frontend
spec:
  type: NodePort # expone la app fuera del clúster local
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
