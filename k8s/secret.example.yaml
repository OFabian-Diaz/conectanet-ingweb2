# PLANTILLA: este archivo NO se aplica y no contiene secretos reales.
#
# El Secret real se crea desde la línea de comandos con los valores del .env
# (así nunca queda escrito en el repositorio):
#
#   kubectl create secret generic conectanet-secretos -n conectanet \
#     --from-literal=DB_PASSWORD="$POSTGRES_PASSWORD" \
#     --from-literal=JWT_SECRET="$JWT_SECRET" \
#     --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD"
#
# Estructura resultante (los valores se guardan en base64, que NO es cifrado):
apiVersion: v1
kind: Secret
metadata:
  name: conectanet-secretos
  namespace: conectanet
type: Opaque
stringData:
  DB_PASSWORD: "<contraseña de PostgreSQL>"
  JWT_SECRET: "<secreto JWT largo y aleatorio>"
  REDIS_PASSWORD: "<contraseña de Redis>"
