# Integración y entrega continua de ConectaNet
#
# En cada push y pull request:
#   1. backend  -> instala dependencias y corre las pruebas (node --test)
#   2. frontend -> instala dependencias y compila React
#   3. infraestructura -> terraform fmt/validate y kubeconform sobre k8s/
#   4. docker   -> valida docker-compose y construye las imágenes de backend y frontend
# Solo en push a main o develop (entrega continua):
#   5. publica las imágenes en GitHub Container Registry (ghcr.io)

name: CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

# Cancela ejecuciones anteriores de la misma rama si llega un push nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Auditoría de dependencias (OWASP A06)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  infraestructura:
    name: Terraform y Kubernetes - validación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
      - name: Terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Terraform validate (sin credenciales ni estado remoto)
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validar manifiestos de Kubernetes contra los esquemas oficiales
        run: |
          docker run --rm -v "$PWD/k8s:/k8s:ro" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-filename-pattern 'kind-config|kustomization' /k8s

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend, infraestructura]
    permissions:
      contents: read
      packages: write # necesario solo para publicar en ghcr.io
    strategy:
      matrix:
        servicio: [backend, frontend]
    env:
      PUBLICAR: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    steps:
      - uses: actions/checkout@v7

      - name: Validar docker-compose.yml
        env:
          POSTGRES_PASSWORD: valor-solo-para-validar
          JWT_SECRET: valor-solo-para-validar
          GRAFANA_ADMIN_PASSWORD: valor-solo-para-validar
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en GitHub Container Registry
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/conectanet-${{ matrix.servicio }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Construir${{ env.PUBLICAR == 'true' && ' y publicar' || '' }} imagen ${{ matrix.servicio }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.servicio }}
          push: ${{ env.PUBLICAR == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
