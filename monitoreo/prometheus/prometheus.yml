global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # API de ConectaNet: /metrics expuesto por prom-client (red interna "monitoreo")
  - job_name: conectanet-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:4000"]
        labels:
          servicio: backend

  # El propio Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
